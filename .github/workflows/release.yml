name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-release:
    name: create-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # electron-builder races release creation when jobs publish
      # concurrently; creating the release up front removes the race.
      # It is created as a DRAFT so electron-updater never sees a "latest"
      # release without latest.yml; publish-release flips it after Windows.
      - name: Create the GitHub release for this tag as a draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"
          || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft
          --title "${GITHUB_REF_NAME#v}" --notes "Poiesis ${GITHUB_REF_NAME#v}"

  windows-latest:
    name: windows-latest
    needs: create-release
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}\.electron-builder-cache
      PUPPETEER_SKIP_DOWNLOAD: "true"
      electron_config_cache: ${{ github.workspace }}\.electron-cache
      npm_config_cache: ${{ github.workspace }}\.npm-cache

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify tag matches application version
        run: >-
          node -e "const version = require('./electron-app/package.json').version;
          if (process.env.GITHUB_REF_NAME !== 'v' + version) {
          throw new Error('Tag ' + process.env.GITHUB_REF_NAME + ' does not match app version ' + version); }"

      - name: Cache Electron and builder downloads
        uses: actions/cache@v4
        with:
          path: |
            .electron-cache
            .electron-builder-cache
            .electron-home
          key: release-${{ runner.os }}-x64-electron-39.8.7-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            release-${{ runner.os }}-x64-electron-39.8.7-

      - name: Cache built-in VS Code extensions
        uses: actions/cache@v4
        with:
          path: plugins
          key: release-plugins-${{ runner.os }}-x64-${{ hashFiles('package.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Download built-in VS Code extensions
        run: npm run download:plugins

      - name: Rebuild native dependencies and build Electron target
        run: npm run build:electron

      - name: Build and publish Windows release artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          node node_modules/electron-builder/out/cli/cli.js
          --projectDir electron-app
          --win nsis
          --x64
          --publish always
          --config electron-builder.yml

  publish-release:
    name: publish-release
    needs: windows-latest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Windows artifacts (installer, blockmap, latest.yml) are attached now, so
      # the release can become visible to electron-updater; macOS assets are
      # added to the published release afterwards.
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false

  macos:
    name: macos (${{ matrix.arch }})
    needs: windows-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          # arm64 only: Rosetta node-gyp crashes ("async hook stack has
          # become corrupted") and the Intel macos-13 runner pool queues
          # for hours without allocating. Revisit x64 only if an Intel
          # Mac actually needs it.
          - arch: arm64
            runner: macos-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.electron-builder-cache
      PUPPETEER_SKIP_DOWNLOAD: "true"
      electron_config_cache: ${{ github.workspace }}/.electron-cache
      npm_config_cache: ${{ github.workspace }}/.npm-cache

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          architecture: ${{ matrix.arch }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify tag matches application version
        run: >-
          node -e "const version = require('./electron-app/package.json').version;
          if (process.env.GITHUB_REF_NAME !== 'v' + version) {
          throw new Error('Tag ' + process.env.GITHUB_REF_NAME + ' does not match app version ' + version); }"

      - name: Cache Electron and builder downloads
        uses: actions/cache@v4
        with:
          path: |
            .electron-cache
            .electron-builder-cache
            .electron-home
          key: release-${{ runner.os }}-${{ matrix.arch }}-electron-39.8.7-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            release-${{ runner.os }}-${{ matrix.arch }}-electron-39.8.7-

      - name: Cache built-in VS Code extensions
        uses: actions/cache@v4
        with:
          path: plugins
          key: release-plugins-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('package.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Download built-in VS Code extensions
        run: npm run download:plugins

      - name: Rebuild native dependencies and build Electron target
        run: npm run build:electron

      - name: Build and publish macOS release artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          node node_modules/electron-builder/out/cli/cli.js
          --projectDir electron-app
          --mac dmg zip
          --${{ matrix.arch }}
          --publish always
          --config electron-builder.yml
          --config.publish.channel=mac-${{ matrix.arch }}
